openapi: 3.1.0
info:
  title: Asad Architect API
  version: 0.1.0
  description: Compile-time contract shared by the Node API and the static client.
paths:
  /health:
    get:
      responses:
        "200":
          description: Process is alive. No datastore or GROQ checks.
  /ready:
    get:
      responses:
        "200":
          description: Internal middleware and routes are registered.
  /api/chat:
    post:
      responses:
        "200":
          description: Accepted job `{ id, status, token }`; client opens SSE with that accessor.
  /api/stream:
    get:
      responses:
        "200":
          description: text/event-stream token channel.
